<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Admin — Rambu Solo</title>
  <meta name="description" content="Login admin untuk mengelola konten website Rambu Solo." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-shell-body">

  <div class="auth-shell">

    <!-- PANEL VISUAL -->
    <div class="auth-visual" style="background-image: url('images/hero-rambu-solo.jpg');">
      <div class="auth-visual__overlay"></div>
      <div class="auth-visual__content">
        <a href="index.html" class="auth-visual__brand">Rambu<span>Solo</span></a>

        <div class="auth-visual__body">
          <span class="auth-visual__kicker">Panel Admin</span>
          <h1>Kelola konten<br>Rambu Solo</h1>
          <p>Masuk untuk mengedit teks, memperbarui data kontak, dan menjaga isi website tetap akurat &amp; terkini.</p>
        </div>

        <a href="index.html" class="auth-visual__back">&larr; Kembali ke Beranda</a>
      </div>
    </div>

    <!-- PANEL FORM -->
    <div class="auth-form-side">
      <div class="login-box auth-box" id="authBox">

        <div class="auth-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- FORM LOGIN -->
        <div id="panelLogin">
          <h2>Login Admin</h2>
          <p class="auth-subtitle">Khusus untuk admin website Rambu Solo.</p>
          <form onsubmit="return prosesLogin(event)" autocomplete="off">
            <div class="input-group">
              <label for="loginUsername">Username</label>
              <input type="text" id="loginUsername" placeholder="Masukkan username" autocomplete="off">
            </div>
            <div class="input-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="new-password">
            </div>
            <p class="login-error hidden" id="loginError"></p>
            <p class="login-success hidden" id="loginSuccess"></p>
            <button type="submit" id="loginButton">Masuk ke Panel Admin</button>
            <div class="loader hidden" id="loginLoader"></div>
          </form>
        </div>

      </div>
    </div>

  </div>

  <script src="js/auth.js?v=20260916-2"></script>
  <script src="js/login-page.js"></script>

</body>
</html>
